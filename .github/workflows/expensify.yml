name: Expensify

on:
  push:
    branches: [main]
    paths:
      - Formula/expensify.rb
      - scripts/**
      - .github/workflows/expensify.yml
      - .github/workflows/update-expensify.yml
  pull_request:
    paths:
      - Formula/expensify.rb
      - scripts/**
      - .github/workflows/expensify.yml
      - .github/workflows/update-expensify.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: expensify-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  HOMEBREW_NO_AUTO_UPDATE: '1'

jobs:
  install:
    name: Install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Set up Homebrew and check out tap
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1
        with:
          stable: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Test formula updater
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Check formula style
        run: brew style Formula/expensify.rb
      - name: Install release binary
        run: brew install magarcia/tap/expensify
      - name: Test installed CLI
        run: brew test magarcia/tap/expensify
      - name: Audit formula
        run: brew audit --strict magarcia/tap/expensify
